<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mèo Đen Convert — đổi định dạng ảnh (kể cả HEIC) và tạo mã QR ngay trên trình duyệt." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffaf0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d1a26" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mèo Đen Convert</title>
    <script>
      // Apply theme + language before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem("meoden.theme") || "{}")
        var mode = (saved.state && saved.state.mode) || "system"
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
        document.documentElement.style.colorScheme = dark ? "dark" : "light"
        var lang = localStorage.getItem("meoden.lang")
        if (lang) document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
